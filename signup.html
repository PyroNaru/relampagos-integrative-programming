<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skulkborne</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="hero">
      <div class="hero-content">
        <div class="login">
          <form id="signupForm" style="border: 1px solid #ccc">
            <div class="container">
              <h1>Sign Up</h1>
              <p>Please fill in this form to create an account.</p>
              <hr />

              <label for="email"><b>Email</b></label>
              <input
                type="text"
                placeholder="Enter Email"
                name="email"
                id="signupEmail"
                required
              />

              <label for="psw"><b>Password</b></label>
              <input
                type="password"
                placeholder="Enter Password"
                name="psw"
                id="signupPassword"
                required
              />

              <label for="psw-repeat"><b>Repeat Password</b></label>
              <input
                type="password"
                placeholder="Repeat Password"
                name="psw-repeat"
                id="signupConfirm"
                required
              />

              <label>
                <input
                  type="checkbox"
                  checked="checked"
                  name="remember"
                  style="margin-bottom: 15px"
                />
                Remember me
              </label>

              <p>
                By creating an account you agree to our
                <a href="#" style="color: dodgerblue">Terms & Privacy</a>.
              </p>

              <div class="clearfix">
                <button type="submit" class="signupbtn">Sign Up</button>
                <a href="login.html" class="btn">Back to login</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </section>

    <footer>
      Compiled by: Miguel Relampagos · 2026
      <p class="disclaimer">
        Disclaimer not actual art... I dont have skills nor money to pay for
        actual art so all assets and arts are merely placeholders.
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
