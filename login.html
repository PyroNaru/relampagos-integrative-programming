<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skulkborne</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="hero">
      <div class="hero-content">
        <div class="login">
          <form id="loginForm">
            <div class="imgcontainer"></div>

            <h1>Skulkborne</h1>

            <div class="container">
              <label for="uname"><b>Username</b></label>
              <input
                type="text"
                placeholder="Enter Username"
                name="uname"
                id="loginUsername"
                required
              />

              <label for="psw"><b>Password</b></label>
              <input
                type="password"
                placeholder="Enter Password"
                name="psw"
                id="loginPassword"
                required
              />

              <button type="submit">Login</button>

              <div class="container">
                <label>
                  <input type="checkbox" checked="checked" name="remember" />
                  Remember me
                </label>

                <span class="psw"><a href="#">Forgot password?</a></span>
                <span class="psw">
                  <a href="signup.html">Don't have an account?</a>
                </span>
              </div>
            </div>
          </form>
        </div>
      </div>
    </section>

    <footer>
      Compiled by: Miguel Relampagos · 2026
      <p class="disclaimer">
        Disclaimer not actual art... I dont have skills nor money to pay for
        actual art so all assets and arts are merely placeholders.
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
